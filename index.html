<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class = "top-bar">
        <div class="Windows">
            💻 WebOS
        </div>
        <div class ="status-icons">
            📶 🔊 🔋
        </div>
    </header>

    <main class="desktop">
        <div class ="files-icon app-icon">
            📁 
            <div class="file">
                Files
            </div>
        </div>
        
        <div class ="Notepad-icon app-icon">
            📝 
            <div class ="Notepad">
            Notepad
        </div>
        </div>
        
        <div class ="Calculator-icon app-icon">
            🧮 
            <div class ="Calculator">
            Calculator
        </div>
        </div>
        

    </main>

    <div class="Notepad-app">
        <header class="notepad-head">
            <h1>Notepad</h1>
            <div class="buttons">
                <button class="close">×</button>
            <button class="minimize">-</button>
            <button class="maximize">□</button>
            </div>
            
        </header>
        <main class="notepad-main">
            <textarea
            rows="5"
            cols="40"
            placeholder="Write your thoughts...">
        </textarea>
        </main>
        
    </div>

    <footer class="taskbar">
        <div class="start-icon">
            ⊞
        </div>
        <div class="task">
            Taskbar
        </div>
        <div class="start-menu">
            
        </div>
        <div class="start-menu">
            <p>Welcome to WebOS!</p>
            <p>📁 Files</p>
            <p>📝 Notepad</p>
            <p>🧮 Calculator</p>
        </div>
    </footer>
    

    <script src="script.js"></script>
</body>
</html>
